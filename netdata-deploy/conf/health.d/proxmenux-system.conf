# ProxMenux fork: system thresholds from the TZ (section 8).
# Replace stock 10min_cpu_usage, ram_in_use and disk_space_usage, which are
# disabled on the Parent via `[health] enabled alarms` in netdata.conf.
# Child-disconnect (streaming_disconnected) and Docker (docker_container_down)
# alerts are Netdata stock alerts and stay enabled.

   template: proxmenux_cpu_usage
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -5m unaligned of user,system,softirq,irq,guest
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING) ? (85) : (90))
      delay: down 15m multiplier 1.5 max 1h
    summary: CPU utilization above 90% for 5 minutes
       info: Average CPU utilization over the last 5 minutes (excluding iowait, nice and steal)
         to: sysadmin

   template: proxmenux_ram_usage
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
     lookup: average -5m unaligned of used
       calc: $this * 100 / ($used + $cached + $free + $buffers)
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING) ? (85) : (90))
      delay: down 15m multiplier 1.5 max 1h
    summary: RAM utilization above 90% for 5 minutes
       info: Used RAM (page cache excluded) averaged over the last 5 minutes
         to: sysadmin

   template: proxmenux_disk_space_usage
         on: disk.space
      class: Utilization
       type: System
  component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* *
       calc: $used * 100 / ($avail + $used)
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING) ? (80) : (85))
       crit: $this > (($status == $CRITICAL) ? (90) : (95))
      delay: up 1m down 15m multiplier 1.5 max 1h
    summary: Disk ${label:mount_point} space usage
       info: Space utilization of ${label:mount_point}
         to: sysadmin
