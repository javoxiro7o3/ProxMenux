# ProxMenux fork: HPE Smart Array and SMART alerts.
# Netdata ships no alerts for the hpssa and smartctl collectors, so they are defined here.
# Contexts and dimension names are taken from the Netdata go.d collector source
# (hpssa/charts.go, smartctl/charts.go). Status charts have dimensions ok/nok
# (passed/failed for SMART) with value 1 for the current state.
#
# STATUS: syntax follows Netdata health reference; NOT yet tested against real
# ssacli output on DL380 Gen10. Verify with a degraded-array test before relying on it.

 template: proxmenux_hpssa_controller_status
       on: hpssa.controller_status
    class: Errors
     type: System
component: RAID
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Smart Array controller ${label:model} (slot ${label:slot}) status
     info: HPE Smart Array controller ${label:model} in slot ${label:slot} reports a non-OK status
       to: sysadmin

 template: proxmenux_hpssa_cache_status
       on: hpssa.controller_cache_module_status
    class: Errors
     type: System
component: RAID
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Smart Array cache module (slot ${label:slot}) status
     info: HPE Smart Array cache module in slot ${label:slot} reports a non-OK status
       to: sysadmin

 template: proxmenux_hpssa_cache_battery_status
       on: hpssa.controller_cache_module_battery_status
    class: Errors
     type: System
component: RAID
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Smart Array cache battery (slot ${label:slot}) status
     info: HPE Smart Array cache battery/capacitor in slot ${label:slot} reports a non-OK status
       to: sysadmin

 template: proxmenux_hpssa_array_status
       on: hpssa.array_status
    class: Errors
     type: System
component: RAID
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Smart Array array ${label:array_id} (slot ${label:slot}) status
     info: Array ${label:array_id} on controller slot ${label:slot} reports a non-OK status
       to: sysadmin

 template: proxmenux_hpssa_logical_drive_status
       on: hpssa.logical_drive_status
    class: Errors
     type: System
component: RAID
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Logical drive ${label:logical_drive_id} (${label:disk_name}) degraded
     info: Logical drive ${label:logical_drive_id} (${label:disk_name}) on array ${label:array_id}, slot ${label:slot} is not OK (degraded, rebuilding or failed)
       to: sysadmin

 template: proxmenux_hpssa_physical_drive_status
       on: hpssa.physical_drive_status
    class: Errors
     type: System
component: Disk
   lookup: max -30s unaligned of nok
    units: status
    every: 30s
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Physical drive ${label:location} failed
     info: Physical drive ${label:location} (${label:model}) in array ${label:array_id}, slot ${label:slot} is not OK
       to: sysadmin

 template: proxmenux_hpssa_physical_drive_temperature
       on: hpssa.physical_drive_temperature
    class: Utilization
     type: System
component: Disk
   lookup: average -5m unaligned of temperature
    units: Celsius
    every: 1m
     warn: $this > (($status >= $WARNING) ? (50) : (55))
    delay: down 15m multiplier 1.5 max 1h
  summary: Physical drive ${label:location} temperature
     info: Physical drive ${label:location} average temperature over the last 5 minutes
       to: sysadmin

 template: proxmenux_smart_status
       on: smartctl.device_smart_status
    class: Errors
     type: System
component: Disk
   lookup: max -10m unaligned of failed
    units: status
    every: 1m
     crit: $this > 0
    delay: down 5m multiplier 1.5 max 1h
  summary: Disk ${label:device_name} SMART health failed
     info: SMART overall health of ${label:device_name} (${label:model_name}, serial ${label:serial_number}) is FAILED
       to: sysadmin

 template: proxmenux_smart_temperature
       on: smartctl.device_temperature
    class: Utilization
     type: System
component: Disk
   lookup: average -10m unaligned of temperature
    units: Celsius
    every: 1m
     warn: $this > (($status >= $WARNING) ? (50) : (55))
    delay: down 15m multiplier 1.5 max 1h
  summary: Disk ${label:device_name} temperature
     info: Average temperature of ${label:device_name} over the last 10 minutes
       to: sysadmin
